<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Топ Донатеров</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 40px auto;
    background: #f5f5f5;
    padding: 20px;
}

h1 {
    text-align: center;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #333;
    color: white;
}

.gold { background: #ffd700; }
.silver { background: #c0c0c0; }
.bronze { background: #cd7f32; color: white; }

.donate-btn {
    display: block;
    width: 200px;
    margin: 20px auto;
    padding: 15px;
    text-align: center;
    background: #28a745;
    color: white;
    text-decoration: none;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>🏆 Топ Донатеров</h1>

<a class="donate-btn" href="https://www.paypal.com/donations">
    💰 Поддержать проект
</a>

<table id="leaderboard">
    <thead>
        <tr>
            <th>Место</th>
            <th>Имя</th>
            <th>Сумма ($)</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
let donors = [
    {name: "Alex", amount: 150},
    {name: "Ali", amount: 90},
    {name: "Max", amount: 50}
];

donors.sort((a,b) => b.amount - a.amount);

const tbody = document.querySelector("#leaderboard tbody");

donors.forEach((donor,index) => {
    let row = document.createElement("tr");

    if(index === 0) row.className = "gold";
    if(index === 1) row.className = "silver";
    if(index === 2) row.className = "bronze";

    row.innerHTML = `
        <td>${index+1}</td>
        <td>${donor.name}</td>
        <td>${donor.amount}</td>
    `;

    tbody.appendChild(row);
});
</script>

</body>
</html>
