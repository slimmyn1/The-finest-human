<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Most Generous Person</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Poppins',sans-serif;
overflow-x:hidden;
color:white;
min-height:100vh;

background:
linear-gradient(rgba(0,0,0,0.78),rgba(0,0,0,0.92)),
url('https://images3.alphacoders.com/137/thumb-1920-1379845.jpg');

background-size:cover;
background-position:center;
background-attachment:fixed;

}

/* PETALS */

.petals span{

position:fixed;
top:-10%;
font-size:28px;
z-index:0;
animation:fall linear infinite;
opacity:0.8;

}

.petals span:nth-child(1){left:5%;animation-duration:10s;}
.petals span:nth-child(2){left:15%;animation-duration:15s;}
.petals span:nth-child(3){left:28%;animation-duration:13s;}
.petals span:nth-child(4){left:42%;animation-duration:18s;}
.petals span:nth-child(5){left:55%;animation-duration:12s;}
.petals span:nth-child(6){left:70%;animation-duration:16s;}
.petals span:nth-child(7){left:82%;animation-duration:11s;}
.petals span:nth-child(8){left:94%;animation-duration:17s;}

@keyframes fall{

0%{
transform:translateY(-10vh) rotate(0deg);
}

100%{
transform:translateY(120vh) rotate(360deg);
}

}

/* HEADER */

header{

text-align:center;
padding:60px 20px 30px;
position:relative;
z-index:2;

}

header h1{

font-size:65px;
text-shadow:0 0 30px #ff9ac7;
animation:glow 3s infinite alternate;

}

@keyframes glow{

from{
text-shadow:0 0 15px #ff9ac7;
}

to{
text-shadow:0 0 45px #ffc0cb;
}

}

.subtitle{

margin-top:15px;
font-size:20px;
opacity:0.85;

}

/* TOP DONATOR */

.top-donator{

width:340px;
margin:25px auto;

padding:25px;

border-radius:30px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,0.15);

text-align:center;

box-shadow:0 0 35px rgba(255,215,0,0.2);

position:relative;
z-index:2;

animation:float 4s infinite ease-in-out;

}

.top-donator h2{

font-size:30px;
margin-bottom:10px;

}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0px);
}

}

/* STATS */

.stats{

display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;

margin:40px;

position:relative;
z-index:2;

}

.stat-box{

width:220px;

padding:25px;

border-radius:25px;

background:rgba(255,255,255,0.08);

border:1px solid rgba(255,255,255,0.15);

backdrop-filter:blur(12px);

text-align:center;

transition:0.3s;

box-shadow:0 0 25px rgba(255,192,203,0.12);

}

.stat-box:hover{

transform:translateY(-8px) scale(1.03);

box-shadow:0 0 35px rgba(255,192,203,0.25);

}

.stat-box h2{

font-size:38px;
margin-bottom:10px;

}

/* BUTTON */

.buttons{

display:flex;
justify-content:center;
margin-bottom:40px;

position:relative;
z-index:2;

}

.btn{

padding:18px 40px;

border-radius:20px;

text-decoration:none;

color:white;

font-weight:bold;

font-size:18px;

background:rgba(255,255,255,0.08);

border:1px solid rgba(255,255,255,0.15);

backdrop-filter:blur(10px);

transition:0.3s;

box-shadow:0 0 20px rgba(255,192,203,0.12);

}

.btn:hover{

transform:scale(1.08);

background:rgba(255,182,193,0.15);

box-shadow:0 0 35px rgba(255,182,193,0.35);

}

/* LEADERBOARD */

.board{

width:92%;
max-width:980px;

margin:auto;

background:rgba(255,255,255,0.07);

border-radius:30px;

overflow:hidden;

backdrop-filter:blur(12px);

box-shadow:0 0 35px rgba(255,192,203,0.15);

position:relative;
z-index:2;

}

table{

width:100%;
border-collapse:collapse;

}

th{

background:rgba(255,182,193,0.2);

padding:22px;

font-size:20px;

}

td{

padding:22px;
text-align:center;

}

tr{

border-bottom:1px solid rgba(255,255,255,0.08);

transition:0.3s;

}

tr:hover{

background:rgba(255,255,255,0.05);

transform:scale(1.01);

}

.gold{
background:linear-gradient(90deg,#ffd70055,#fff2a855);
}

.silver{
background:linear-gradient(90deg,#c0c0c055,#ffffff55);
}

.bronze{
background:linear-gradient(90deg,#cd7f3255,#d89b6655);
}

/* DONATION CHAT */

.donation-chat{

width:92%;
max-width:700px;

margin:45px auto;

padding:25px;

border-radius:30px;

background:rgba(255,255,255,0.07);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,0.12);

position:relative;
z-index:2;

}

.donation-chat h2{

margin-bottom:20px;
text-align:center;

}

.messages{

height:280px;
overflow-y:auto;

padding:15px;

background:rgba(0,0,0,0.2);

border-radius:20px;

}

.message{

margin-bottom:15px;

padding:14px;

border-radius:15px;

background:rgba(255,255,255,0.08);

line-height:1.5;

}

/* AUDIO */

.music{

text-align:center;
margin-top:40px;
position:relative;
z-index:2;

}

/* FOOTER */

footer{

text-align:center;
margin:50px;
opacity:0.75;
position:relative;
z-index:2;

}

</style>

</head>

<body>

<audio autoplay loop id="bgmusic">

<source src="https://cdn.pixabay.com/audio/2023/03/14/audio_8f49b7d3e8.mp3" type="audio/mpeg">

</audio>

<div class="petals">

<span>🌸</span>
<span>🌸</span>
<span>🌸</span>
<span>🌸</span>
<span>🌸</span>
<span>🌸</span>
<span>🌸</span>
<span>🌸</span>

</div>

<header>

<h1>🌸 THE MOST GENEROUS PERSON 🌸</h1>

<div class="subtitle">

the ultimate cherry blossom donation leaderboard

</div>

</header>

<div class="top-donator">

<h2>👑 TOP DONATOR</h2>

<h1 id="topName">---</h1>

<h3 id="topAmount">$0</h3>

</div>

<div class="stats">

<div class="stat-box">

<h2 id="total">$0</h2>

<p>Total Donations</p>

</div>

<div class="stat-box">

<h2 id="supporters">0</h2>

<p>Supporters</p>

</div>

<div class="stat-box">

<h2>24/7</h2>

<p>Community</p>

</div>

</div>

<div class="buttons">

<a class="btn"
href="https://www.donationalerts.com/r/slimmy_n1"
target="_blank">

💖 DONATE

</a>

</div>

<div class="board">

<table>

<thead>

<tr>

<th>Rank</th>
<th>Name</th>
<th>Donation</th>

</tr>

</thead>

<tbody id="leaderboard"></tbody>

</table>

</div>

<!-- DONATION CHAT -->

<div class="donation-chat">

<h2>💬 Live Donations</h2>

<div class="messages" id="messages"></div>

</div>

<div class="music">

<audio controls loop>

<source src="https://cdn.pixabay.com/audio/2023/03/14/audio_8f49b7d3e8.mp3" type="audio/mpeg">

</audio>

</div>

<footer>

Made with 🌸 for the community

</footer>

<script>

/* DONORS */

let donors = [

{name:"kai",amount:5,message:"w project fr"},
{name:"mika",amount:2,message:"what is this gng 😭"},
{name:"noah",amount:5,message:"this site clean ngl"},
{name:"luna",amount:2,message:"thats good fr"}

];

function renderLeaderboard(){

donors.sort((a,b)=>b.amount-a.amount);

const board=document.getElementById("leaderboard");

board.innerHTML="";

let total=0;

donors.forEach((donor,index)=>{

total+=donor.amount;

let row=document.createElement("tr");

if(index===0) row.className="gold";
if(index===1) row.className="silver";
if(index===2) row.className="bronze";

let medal=index+1;

if(index===0) medal="🥇";
if(index===1) medal="🥈";
if(index===2) medal="🥉";

row.innerHTML=`

<td>${medal}</td>
<td>${donor.name}</td>
<td>$${donor.amount}</td>

`;

board.appendChild(row);

});

document.getElementById("total").innerHTML="$"+total;

document.getElementById("supporters").innerHTML=donors.length;

document.getElementById("topName").innerHTML="👑 "+donors[0].name;

document.getElementById("topAmount").innerHTML="$"+donors[0].amount;

}

renderLeaderboard();

/* LIVE DONATION CHAT */

function renderMessages(){

const messages=document.getElementById("messages");

messages.innerHTML="";

donors.forEach(donor=>{

let div=document.createElement("div");

div.className="message";

div.innerHTML=`

<b>💖 ${donor.name}</b> donated <b>$${donor.amount}</b><br>
"${donor.message}"

`;

messages.appendChild(div);

});

}

renderMessages();

/* FAKE RANDOM DONATIONS */

let randomDonations=[

{name:"ken",amount:2,message:"nah this fire 😭"},
{name:"yuki",amount:5,message:"bro cooked"},
{name:"alex",amount:2,message:"clean website fr"},
{name:"rei",amount:5,message:"what is this gng"},
{name:"matt",amount:2,message:"music majestic"},
{name:"leo",amount:5,message:"yo this tuff"},
{name:"niko",amount:2,message:"w design"},
{name:"mia",amount:5,message:"ngl beautiful"}

];

setInterval(()=>{

let random=randomDonations[Math.floor(Math.random()*randomDonations.length)];

donors.unshift(random);

if(donors.length>4){

donors.pop();

}

renderLeaderboard();

renderMessages();

},10000);

/* MUSIC */

window.addEventListener("click",()=>{

document.getElementById("bgmusic").play();

});

</script>

</body>
</html>
